name: friendly-marks

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    image: minio/mc:latest
    env_file:
      - .env
    depends_on:
      storage:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "storage-init: waiting for storage API to accept credentials..."
        i=0
        until mc alias set local http://storage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i+1))
          if [ "$$i" -ge 30 ]; then
            echo "storage-init: giving up after 30 attempts"
            exit 1
          fi
          sleep 2
        done
        echo "storage-init: alias set, ensuring bucket $$MINIO_BUCKET exists..."
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        echo "storage-init: done — bucket $$MINIO_BUCKET is ready"

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./apps/web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:5173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  storage-data:
  web-node-modules:
